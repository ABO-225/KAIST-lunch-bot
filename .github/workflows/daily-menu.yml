name: daily-menu

on:
  schedule:
    # KAIST 접속이 가끔 시간 초과되어 여러 번 실행 (한 번 성공하면 그날 파일은 유지됨)
    # UTC 기준 → KST: 09:00, 09:40, 10:20, 11:00, 15:30, 16:10
    - cron: "0 0 * * *"
    - cron: "40 0 * * *"
    - cron: "20 1 * * *"
    - cron: "0 2 * * *"
    - cron: "30 6 * * *"
    - cron: "10 7 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 오늘 메뉴 만들기 (점심·저녁)
        run: |
          python main.py --meal lunch --out docs/today.txt
          python main.py --meal dinner --out docs/dinner.txt
      - name: 메뉴 확인
        run: |
          cat docs/today.txt
          echo "-----"
          cat docs/dinner.txt
      - name: 저장소에 반영
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/today.txt docs/dinner.txt
          git diff --cached --quiet || git commit -m "menu $(date +%F)"
          git pull --rebase
          git push
